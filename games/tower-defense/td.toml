# Tower defense: the map, the towers, the creeps and the waves, read by
# Defense.xtl (X_eTaL's []L_IST and []T_ABLE). Every value is a string.
#
# The map, rows of equal length: . grass (towers go here), = the road,
# S where the creeps come in, E where they get out (costing lives). The
# road must be one path from S to E; the creeps follow it.
map = [
  "................",
  "S=====..........",
  ".....=..........",
  ".....=...======.",
  ".....=...=....=.",
  ".....=====....=.",
  "..............=.",
  "..=============.",
  "..=.............",
  "..=============E",
]

# Money and lives at the start.
start = ["120", "20"]

# The towers, each at three levels: how far it reaches (tiles), the
# damage of a shot, the seconds between shots, the splash (tiles; 0 hits
# only the target), the seconds a hit slows a creep (0 none), and the
# cost of building it (level 1) or of the upgrade to that level.
towers = ["arrow-1", "arrow-2", "arrow-3", "cannon-1", "cannon-2", "cannon-3", "frost-1", "frost-2", "frost-3"]
tower-fields = ["name", "range", "damage", "cooldown", "splash", "slow", "cost", "about"]

# The creeps: their hit points, speed (tiles a second), armor (taken
# off each hit's damage, which is never below 1), the money each brings
# when beaten, the lives it costs if it gets out, and its letter in the
# waves.
creeps = ["runner", "brute", "shield"]
creep-fields = ["name", "hp", "speed", "armor", "bounty", "leak", "letter", "about"]

# The waves, in order: one letter a creep, in the order they come (a
# second apart). Clear the last wave to win.
waves = ["rrrrrr", "rrrrbrrrr", "rrssrrss", "bbrrrrbb", "ssssbbss", "rrrrrrrrrrbbbsss"]

# Whether the pieces are drawn with the 3D art published by
# X_eTaL-extensions (fetched by assets/fetch.sh into assets/cache/art/;
# see docs/extensions-ask.md) or with the game's own shapes: "1" or "0".
art = ["0"]

