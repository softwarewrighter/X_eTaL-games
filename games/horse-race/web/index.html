<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horse Race</title>
  <link data-trunk rel="rust" data-bin="horse-race-web" />
  <link data-trunk rel="copy-file" href="../../../images/modern-xetal-logo.jpg" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../shared/microscope/microscope.css" />
  <style>
    .track { margin: 0; padding: 12px 14px; background: var(--off); border-radius: 8px; overflow-x: auto;
      font: 1.05rem/1.6 ui-monospace, "JuliaMono", Menlo, monospace; }
    .track .row { display: block; cursor: pointer; border-radius: 4px; padding: 0 4px; }
    .track .row:hover { background: var(--card); }
    .track .row.pick { box-shadow: inset 0 0 0 2px var(--accent); }
    .track .row.win { background: #d3f9d8; color: #1d1d1f; }
    .rolls { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
    .rolls span { min-width: 2.2em; text-align: center; padding: 2px 6px; border-radius: 6px;
      background: var(--off); font-variant-numeric: tabular-nums; font-weight: 600; }
    .result { font-weight: 600; margin: 8px 0 0; }
  </style>
</head>
<body></body>
</html>
