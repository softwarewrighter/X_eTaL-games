<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Number</title>
  <link data-trunk rel="rust" data-bin="guess-web" />
  <link data-trunk rel="copy-file" href="../../../images/modern-xetal-logo.jpg" />
  <link data-trunk rel="icon" href="../../../images/favicon.ico" />
  <link data-trunk rel="css" href="../../../shared/microscope/microscope.css" />
  <style>
    .term { margin: 0; padding: 12px 14px; background: #10141a; color: #c9f7c9; border-radius: 8px;
      font: .98rem/1.5 ui-monospace, "JuliaMono", Menlo, monospace; min-height: 16em; max-height: 28em; overflow-y: auto; white-space: pre-wrap; }
    .term .in { color: #ffd479; }
    .term form { display: flex; gap: 6px; margin: 4px 0 0; }
    .term input { flex: 1; font: inherit; background: transparent; color: #ffd479; border: 0; border-bottom: 1px solid #3a4a3a; outline: none; }
    .term .done { color: #8fb0ff; }
    .line100 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-width: 420px; }
    .line100 span { text-align: center; font: .78rem/1.9 ui-monospace, Menlo, monospace; border-radius: 3px;
      background: var(--off); color: var(--muted); }
    .line100 span.ok { background: #d3f9d8; color: #1d1d1f; font-weight: 600; }
    .line100 span.lo { background: #a5d8ff; color: #1d1d1f; }
    .line100 span.hi { background: #ffc078; color: #1d1d1f; }
    .line100 span.hit { background: #2f9e44; color: #ffffff; font-weight: 700; }
  </style>
</head>
<body></body>
</html>
